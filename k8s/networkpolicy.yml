apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: deny-all
  namespace: sdp

spec:
  podSelector: {}
  policyTypes: ["Ingress", "Egress"]


apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress
  namespace: sdp
spec:
  podSelector:
    matchLabels:
      app: sdp
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector: {}
      ports:
        - port: 8000
