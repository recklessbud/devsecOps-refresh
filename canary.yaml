apiVersion: v1
kind: Pod
metadata:
  name: canary
  namespace: sdp
spec:
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 10001
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: canary
      image: ghcr.io/recklessbud/devsecops-refresh@sha256:437764c04f4e58b3bc026c10736530153525bfe51bf661f207c6db9cf2e44a99
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: ["ALL"]
