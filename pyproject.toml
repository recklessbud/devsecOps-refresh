[project]
name = "devsecops-refresh"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.162.0",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "bandit>=1.9.4",
    "black>=26.10.1",
    "detect-secrets>=1.5.0",
    "flake8>=7.5.0",
    "httpx>=0.28.1",
    "pip-audit>=2.10.1",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
]

[tool.black]
line-length = 88

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
