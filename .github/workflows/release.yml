name: Release

on:
    workflow_run:
        workflows: ["CI"]
        types: [completed]
        branches: [main]

permissions:
    contents: read

env:
    REGISTRY: ghcr.io


jobs:
    publish:
        name: Build, sign, attest
        # run if ci is passed
        if: github.event.workflow_run.conclusion == 'success'
        runs-on: ubuntu-latest
        permissions:
            contents: read
            packages: write
            id-token: write
            attestations: write
        steps:
        - uses: actions/checkout@v4
          with:
            ref: ${{ github.event.workflow_run.head_sha }}

        - uses: docker/setup-buildx-action@v3

        - uses: docker/login-action@v3
          with:
            registry: ${{env.REGISTRY}}
            username: ${{github.actor}}
            password: ${{secrets.GITHUB_TOKEN}}

        - name: Normalize image name
          id: image-name
          run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

        - name: Build and push
          id: build
          uses: docker/build-push-action@v6
          with:
            context: .
            push: true
            pull: true
            tags: ${{ steps.image-name.outputs.image }}:${{ github.event.workflow_run.head_sha }}
            provenance: mode=max
            sbom: true

        - uses: sigstore/cosign-installer@v3
        - name: Sign image(keyless)
          run: cosign sign --yes ${{ steps.image-name.outputs.image }}@${{steps.build.outputs.digest}}


        - name: Generate SBOM (cyclonDX)
          uses: anchore/sbom-action@v0
          with:
            image: ${{ steps.image-name.outputs.image }}@${{steps.build.outputs.digest}}
            format: cyclonedx-json
            output-file: sbom.cdx.json
            upload-artifact: true

        - name: Arrach SBOM as signed attestation
          run: >
            cosign attest --yes --type cyclonedx --predicate sbom.cdx.json ${{ steps.image-name.outputs.image }}@${{steps.build.outputs.digest}}

        - name: Verify signature
          run: >
            cosign verify
            --certificate-identity-regexp "^https://github.com/${{ github.repository }}/"
            --certificate-oidc-issuer https://token.actions.githubusercontent.com
            ${{ steps.image-name.outputs.image }}@${{ steps.build.outputs.digest }}
